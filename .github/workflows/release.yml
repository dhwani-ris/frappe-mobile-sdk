name: Release

# `main` cuts a stable release on push. `develop` cuts a `-beta.N` prerelease but
# is DELIBERATELY NOT on the push trigger: a beta is fired by hand, with
# `workflow_dispatch` against `develop`. semantic-release still works out that
# the next one is `beta.4`, `beta.5` and so on, so the hand-versioning this
# replaces is gone either way — what stays manual is the DECISION to cut.
#
# Two reasons it is not automatic. Publishing to pub.dev is manual anyway (there
# is no publish automation here), so an automatic tag would not put anything in
# front of a consumer any sooner. And every release costs a DOUBLED CI run: the
# bot's `chore(release):` bump is pushed with a GitHub App installation token,
# and App-token pushes do re-trigger workflows, so each cut re-fires `ci.yml`
# (~4m30s) plus a `release.yml` run that exits "no release published". Rare on
# `main`; once per beta on `develop`.
#
# A branch must be listed BOTH in `.releaserc` `branches` and here (or dispatched
# against) — semantic-release refuses to release from a branch it was not
# configured for, so `develop` stays in `.releaserc` even though it is absent
# below. Adding it to `push.branches` is all that is needed to make betas
# automatic later.
#
# A prerelease merged into `main` (a release PR whose `pubspec.yaml` already says
# `2.0.0-beta.N`) is NOT handed to semantic-release. On `main` it ignores the
# `-beta` tags, takes the last stable tag as the base and computes the next
# stable version instead: measured with `npx semantic-release --dry-run --no-ci`
# on `main` merged with `develop`, it found `v1.3.0` and computed `1.4.0`. So
# such a push tags the version the pubspec carries, `v<version>`, and creates
# the GitHub prerelease itself. A stable version on `main`, and every
# `develop` dispatch, still goes through semantic-release unchanged.
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  actions: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: generate-token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.DHWANI_RELEASE_BOT_APP_ID }}
          private_key: ${{ secrets.DHWANI_RELEASE_BOT_PRIVATE_KEY }}

      - name: Checkout Entire Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.generate-token.outputs.token }}
          persist-credentials: true

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: "stable"
          cache: true

      - name: Prepare example app config
        run: |
          if [ -f "example/lib/config/app_config.example.dart" ]; then
            cp example/lib/config/app_config.example.dart example/lib/config/app_config.dart
          fi

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter
        run: flutter analyze --no-fatal-infos

      - name: Test Flutter
        run: flutter test

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Setup semantic-release
        run: |
          npm install semantic-release @semantic-release/git @semantic-release/exec @semantic-release/github @semantic-release/commit-analyzer @semantic-release/release-notes-generator --no-save

      - name: Configure Git
        run: |
          git config --global user.name "dhwani-release-bot"
          git config --global user.email "dhwani-release-bot[bot]@users.noreply.github.com"

      - name: Read package version
        id: pkg
        run: |
          # Up to any `#` comment, as `.github/helper/update-version.py` reads it.
          version=$(sed -n 's/^version:[[:space:]]*\([^#[:space:]]*\).*/\1/p' pubspec.yaml | head -n 1)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          if [ "$prerelease" = true ] && { [ "$GITHUB_REF_NAME" = main ] || [ "$GITHUB_REF_NAME" = master ]; }; then
            echo "main_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "main_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create prerelease from pubspec version
        if: steps.pkg.outputs.main_prerelease == 'true'
        env:
          GH_TOKEN: ${{ steps.generate-token.outputs.token }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          tag="v$VERSION"
          # Re-runs and later pushes of the same version are a no-op.
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists, nothing to release"
            exit 0
          fi
          # The nearest earlier tag, so the generated notes cover this release only.
          previous=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "$GITHUB_SHA")
          gh release create "$tag" \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "$tag" \
            --generate-notes \
            --notes-start-tag "$previous" \
            --notes "See [CHANGELOG.md](https://github.com/$GITHUB_REPOSITORY/blob/$tag/CHANGELOG.md) for the full notes."

      - name: Create Release
        if: steps.pkg.outputs.main_prerelease != 'true'
        env:
          GITHUB_TOKEN: ${{ steps.generate-token.outputs.token }}
          GIT_AUTHOR_NAME: "dhwani-release-bot"
          GIT_AUTHOR_EMAIL: "dhwani-release-bot[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "dhwani-release-bot"
          GIT_COMMITTER_EMAIL: "dhwani-release-bot[bot]@users.noreply.github.com"
          NODE_ENV: production
        run: npx semantic-release

