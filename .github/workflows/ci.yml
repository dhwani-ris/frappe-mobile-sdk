# Flutter CI: analyze, test
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: "stable"
          cache: true

      - name: Prepare example app config
        run: |
          if [ -f "example/lib/config/app_config.example.dart" ]; then
            cp example/lib/config/app_config.example.dart example/lib/config/app_config.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # There used to be a "Format code" step running `dart format .` — an
      # IN-PLACE REWRITE — immediately before this check, which made the check
      # structurally incapable of failing whatever was committed. Do not
      # reintroduce it. This step must stay AFTER "Get dependencies": `dart
      # format` reads the package's language version from the resolved
      # `.dart_tool/package_config.json`, and without it the formatter assumes
      # the newest language version and reports a completely different verdict.
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: flutter test
