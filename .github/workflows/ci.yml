# Flutter CI: analyze, test
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: "stable"
          cache: true

      - name: Prepare example app config
        run: |
          if [ -f "example/lib/config/app_config.example.dart" ]; then
            cp example/lib/config/app_config.example.dart example/lib/config/app_config.dart
          fi

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # There used to be a "Format code" step running `dart format .` — an
      # IN-PLACE REWRITE — immediately before this check, which made the check
      # structurally incapable of failing whatever was committed. Do not
      # reintroduce it. This step must stay AFTER "Get dependencies": `dart
      # format` reads the package's language version from the resolved
      # `.dart_tool/package_config.json`, and without it the formatter assumes
      # the newest language version and reports a completely different verdict.
      - name: Format check
        run: dart format --output=none --set-exit-if-changed .

      - name: Test
        run: flutter test

  # The committed root `pubspec.lock` pins the FLOOR of every range, so the job
  # above only ever proves the low end. This one resolves the CEILING, which is
  # where a widened constraint actually earns its keep — and where a new adopter
  # or anyone running `pub upgrade` lands. Without it, "compatible with the
  # newest major" is a claim backed by one person's laptop on one afternoon.
  #
  # `continue-on-error` on purpose: an upstream release can break this at any
  # time through no fault of a contributor's change, and a red X on an unrelated
  # PR trains people to ignore CI. It reports, it does not gate.
  upper-bound:
    name: Resolve dependency ceiling
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.9"
          channel: "stable"
          cache: true

      - name: Prepare example app config
        run: |
          if [ -f "example/lib/config/app_config.example.dart" ]; then
            cp example/lib/config/app_config.example.dart example/lib/config/app_config.dart
          fi

      - name: Resolve newest allowed versions
        run: flutter pub upgrade

      - name: Show what resolved
        run: flutter pub deps --style=compact | head -40

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test

  pre-commit:
    name: 'Pre-Commit'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Check for pre-commit config
        run: |
          if [ ! -f .pre-commit-config.yaml ]; then
            echo "Pre-commit config not found. Downloading..."
            curl -o .pre-commit-config.yaml https://raw.githubusercontent.com/dhwani-ris/frappe-pre-commit/main/examples/.pre-commit-config.yaml
          else
            echo "Pre-commit config already exists."
          fi

      - name: Install pre-commit
        run: pip install pre-commit

      - name: Run pre-commit
        run: pre-commit run --all-files
