name: frappe_mobile_sdk_example
description: Example app demonstrating Frappe Mobile SDK usage
publish_to: 'none'

version: 2.0.0-beta.5

environment:
  # Kept in step with the SDK's own floor: `flutter pub get` in the SDK root also
  # resolves this example, so a higher floor here would break the root resolve
  # for contributors on the SDK's minimum Flutter.
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Test tooling for `lib/creation_capture_probe.dart`; the demo app itself
  # does not use it.
  flutter_skill: ^0.9.36

  # Tracks the 2.x prerelease line. The prerelease is part of the constraint on
  # purpose: a caret on a stable version does NOT admit prereleases, because
  # `2.0.0-beta.4` is ordered BELOW `2.0.0`, so `^2.0.0` resolves
  # `>=2.0.0 <3.0.0` and skips every beta. Only a lower bound that is itself a
  # prerelease lets one through -- `^2.0.0-beta.3` is `>=2.0.0-beta.3 <3.0.0`,
  # which takes later betas AND the eventual 2.0.0 stable.
  #
  # This said `^1.0.0` while the SDK was at 2.0.0-beta.3 -- an impossible
  # constraint that went unnoticed because `dependency_overrides` below replaces
  # the source outright and pub never has to satisfy it. Anyone copying this file
  # as a starting point inherited the mistake, which is the reason to fix a line
  # that has no effect on this repository's own build.
  frappe_mobile_sdk: ^2.0.0-beta.3

# Active on purpose: the example always builds against the SDK in this
# repository, so a change under ../lib shows up here without a publish.
# It is also what makes the constraint above inert HERE — delete this block
# if you copy this file into your own app, and the constraint applies.
dependency_overrides:
  frappe_mobile_sdk:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "../logo.png"

flutter:
  uses-material-design: true
