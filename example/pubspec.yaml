name: frappe_mobile_sdk_example
description: Example app demonstrating Frappe Mobile SDK usage
publish_to: 'none'

version: 2.0.0-beta.2

environment:
  # Kept in step with the SDK's own floor: `flutter pub get` in the SDK root also
  # resolves this example, so a higher floor here would break the root resolve
  # for contributors on the SDK's minimum Flutter.
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  frappe_mobile_sdk: ^1.0.0

# For local development in this repository, uncomment this override:
dependency_overrides:
  frappe_mobile_sdk:
    path: ../

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.5.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "../logo.png"

flutter:
  uses-material-design: true
